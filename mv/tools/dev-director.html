<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev · Director + Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  // Google Fonts. Default: one small subset file per family (text=…) built
  // from the placeholder lines + UI glyphs — fast through slow proxies.
  // ?fonts=full loads the regular unicode-range sheets (needed for pasted text).
  window.DEV_FONTS = (function () {
    const q = new URLSearchParams(location.search);
    const fams = ['Anton', 'Archivo+Black', 'Bebas+Neue', 'Dela+Gothic+One', 'DotGothic16', 'Kaisei+Decol:wght@700',
      'Noto+Sans+JP:wght@500;900', 'Noto+Sans+SC:wght@900', 'Noto+Serif+JP:wght@900', 'Permanent+Marker', 'Potta+One',
      'Rampart+One', 'Reggae+One', 'RocknRoll+One', 'Shippori+Mincho+B1:wght@800', 'Zen+Antique'];
    return {
      full: q.get('fonts') === 'full',
      url(text) {
        let u = 'https://fonts.googleapis.com/css2?family=' + fams.join('&family=') + '&display=block';
        if (text != null) u += '&text=' + encodeURIComponent(Array.from(new Set(Array.from(text))).join(''));
        return u;
      },
      add(href) {
        return new Promise((res) => {
          let tries = 0;
          const go = () => {
            const l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = href + (tries ? '&retry=' + tries : '');
            l.onload = () => res(true);
            l.onerror = () => { l.remove(); if (++tries < 4) setTimeout(go, 400 * tries); else res(false); };
            document.head.appendChild(l);
          };
          go();
        });
      },
    };
  })();
</script>
<style>
  /* Dev-page chrome only; the MV renders into the 1920×1080 canvas. */
  :root { color-scheme: dark; --red: #E60012; --ink: #0A0A0A; --white: #FFFFFF; --muted: rgba(255,255,255,.62); }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--white); font: 13px/1.4 "Noto Sans SC", "Noto Sans JP", system-ui, sans-serif; }
  body { overflow: hidden; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; background: #000; border-bottom: 3px solid var(--red); }
  .bar h1 { margin: 0 8px 0 0; font: 400 24px/1 Anton, Impact, "Arial Narrow", sans-serif; letter-spacing: .04em; transform: skewX(-12deg); text-shadow: 3px 3px 0 var(--red); }
  .bar label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .bar select, .bar textarea { background: #111; color: #fff; border: 1px solid #333; padding: 4px 6px; font: inherit; }
  .bar input[type=range] { width: 260px; accent-color: var(--red); }
  .bar button { border: 0; padding: 7px 12px; font: 700 13px/1 inherit; font-family: inherit; background: #fff; color: var(--ink); transform: skewX(-12deg); box-shadow: 3px 3px 0 var(--red); cursor: pointer; }
  .bar button.red { background: var(--red); color: #fff; box-shadow: 3px 3px 0 #fff; }
  .bar .out { color: var(--muted); font-variant-numeric: tabular-nums; }
  .stage { flex: 1; display: grid; place-items: center; min-height: 0; padding: 12px; }
  canvas#out { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; display: block; }
  details { width: 100%; }
  details textarea { width: min(100%, 900px); height: 160px; display: block; margin-top: 6px; }
  body.noui .bar { display: none; }
  body.noui .stage { padding: 0; }
  @media (max-width: 700px) { .bar input[type=range] { width: 150px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>DEV · DIRECTOR</h1>
    <label>时间 t <input id="t" type="range" min="0" max="221.27" step="0.01" value="0"><span id="tv" class="out"></span></label>
    <label>段落 Section <select id="sec"></select></label>
    <button id="play" type="button">▶ / ❚❚</button>
    <button id="song" type="button" class="red">载入歌曲 Song</button>
    <label><input id="dbg" type="checkbox" checked> 调试 Debug</label>
    <label><input id="hud" type="checkbox" checked> HUD</label>
    <label><input id="adp" type="checkbox"> 自适应 Adaptive</label>
    <label>分辨率 Scale <select id="scale"><option>1</option><option>0.75</option><option>0.5</option></select></label>
    <span id="info" class="out"></span>
    <details><summary>歌词 Lyrics (粘贴 paste — 仅本地 local only)</summary>
      <textarea id="lyr" placeholder="粘贴歌词 / paste lyrics…"></textarea>
      <button id="lyrApply" type="button">应用 Apply</button>
    </details>
  </div>
  <div class="stage"><canvas id="out" width="1920" height="1080"></canvas></div>
</div>
<script src="../js/core.js"></script>
<script src="../data/hoshi-to-bokura-to.js"></script>
<script src="dev-env.js"></script>
<script src="../js/analysis.js" onerror="console.warn('analysis.js missing')"></script>
<script src="../js/audio.js" onerror="console.warn('audio.js missing')"></script>
<script src="../js/lyrics.js" onerror="console.warn('lyrics.js missing')"></script>
<script src="../js/render/scenes.js" onerror="console.warn('scenes.js missing — stubs')"></script>
<script src="../js/render/lyricfx.js" onerror="console.warn('lyricfx.js missing — stubs')"></script>
<script src="../js/render/fx.js" onerror="console.warn('fx.js missing — stubs')"></script>
<script src="../js/render/post.js" onerror="console.warn('post.js missing — plain blit')"></script>
<script src="../js/director.js"></script>
<script src="../js/stage.js"></script>
<script>
(function () {
  'use strict';
  const MV = window.MV;
  (MV._pendingPresets || []).forEach((p) => { if (!MV.getPreset(p.id)) MV.registerPreset(p); });
  const preset = MV.getPreset('hoshi-to-bokura-to');
  const C = MV.C, W = MV.W, H = MV.H;
  const q = new URLSearchParams(location.search);
  if (q.has('noui')) document.body.classList.add('noui');

  /* ---------------------------------------------------------------- */
  /* Stubs for modules that are not there yet (dev only).              */
  /* ---------------------------------------------------------------- */
  const STUBBED = [];
  const SCENES = ['night-city', 'train', 'crowd', 'tunnel', 'stripes', 'sunburst', 'sky-red', 'shards', 'starfield', 'void'];
  SCENES.forEach((name, i) => {
    if (MV.scenes.has(name)) return;
    STUBBED.push('scene:' + name);
    const bg = [C.night, C.black, C.red, C.gray, C.white, C.red, C.redDeep, C.black, C.night, C.black][i];
    MV.scenes.register(name, {
      draw(ctx, env, p) {
        ctx.fillStyle = bg;
        ctx.fillRect(-300, -300, W + 600, H + 600);
        ctx.save();
        ctx.translate(W / 2, H / 2);
        ctx.rotate(-12 * Math.PI / 180);
        ctx.fillStyle = bg === C.white ? C.black : C.white;
        for (let k = -10; k < 10; k++) ctx.fillRect(k * 220 + ((p.lt * 180) % 220), -H, 30, H * 2);
        ctx.font = MV.text.font(160, MV.FONTS.latinCond, 400);
        ctx.textAlign = 'center';
        ctx.fillStyle = C.red;
        ctx.fillText(name.toUpperCase(), 0, 60 * (1 - env.beat.pulse));
        ctx.restore();
      },
    });
  });
  if (!MV.transitions.list().length) {
    ['slash-wipe', 'red-flash', 'shatter', 'ink-wipe', 'star-iris', 'stripe-wipe', 'glitch-cut', 'zoom-punch'].forEach((name) => {
      STUBBED.push('transition:' + name);
      MV.transitions.register(name, {
        duration: 0.5,
        draw(ctx, from, to, p) {
          ctx.drawImage(from, 0, 0, W, H);
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, W * p, H);
          ctx.clip();
          ctx.drawImage(to, 0, 0, W, H);
          ctx.restore();
          ctx.fillStyle = C.red;
          ctx.fillRect(W * p - 20, 0, 40, H);
        },
      });
    });
  }
  if (!MV.effects.list().length) {
    ['flash', 'speedlines', 'ink', 'stars', 'shards', 'ring', 'frame', 'confetti', 'caption', 'credits', 'title', 'endcard'].forEach((name) => {
      STUBBED.push('effect:' + name);
      MV.effects.register(name, {
        layer: name === 'speedlines' || name === 'ink' || name === 'ring' ? 'under' : 'over',
        draw(ctx, env, a) {
          const lt = env.t - a.t;
          if (lt < 0 || lt > a.dur) return;
          ctx.globalAlpha = 1 - lt / a.dur;
          ctx.font = MV.text.font(48, MV.FONTS.latinCond, 400);
          ctx.fillStyle = C.yellow;
          ctx.fillText(name.toUpperCase(), (a.x || W / 2) - 80, a.y || H * 0.3);
        },
      });
    });
  }
  if (!MV.lyricStyles.list().length) {
    ['ransom', 'slash', 'impact', 'dialog', 'vertical', 'card', 'split', 'glitch'].forEach((name) => {
      STUBBED.push('lyric:' + name);
      MV.lyricStyles.register(name, {
        layout: (line) => ({ size: MV.text.fitSize(line.text, MV.FONTS.jpHeavy, 400, 1500, 110) }),
        draw(ctx, line, L, lt, env) {
          ctx.globalAlpha = lt.in * (1 - lt.out);
          ctx.font = MV.text.font(L.size, MV.FONTS.jpHeavy, 400);
          ctx.fillStyle = C.white;
          ctx.strokeStyle = C.black;
          ctx.lineWidth = 10;
          let s = '';
          line.chars.forEach((ch, i) => { if (env.t >= line.charTimes[i]) s += ch; });
          ctx.strokeText(s, 140, H * 0.8);
          ctx.fillText(s, 140, H * 0.8);
        },
      });
    });
  }
  if (STUBBED.length) console.warn('[dev-director] stubs:', STUBBED.join(', '));

  /* ---------------------------------------------------------------- */
  /* Inputs                                                            */
  /* ---------------------------------------------------------------- */
  // Invented placeholder lines (never lyrics of a real song); lengths and
  // phrase structure mimic the preset (hook = 4 tiny words, bridge = 8 bits,
  // two chorus lines with a Latin tail).
  const PLACEHOLDER_LINES = [
    '夜明けの駅で 君を待つ 足音だけが響く',
    '古い地図を 閉じたまま 窓の外を 見ていた',
    '光る街角 走り出す 風の中へ',
    '遠い約束 胸に抱いて Keep moving on tonight',
    '夢 いま ここ ある',
    '消えない 灯り 今夜も 探して ひとり 歩く 夜空の 下で',
    '手を伸ばせば 届く気がした 星の 欠片',
    '光る街角 走り出す 風の中へ',
    '遠い約束 胸に抱いて Keep moving on tonight',
    '明日の扉を 叩く音 いつか また',
    '振り返らずに 進むだけ Keep moving on again',
    '空 いつも 同じ 色',
  ];
  const PLACEHOLDER = PLACEHOLDER_LINES.join('\n');

  // Fonts: subset sheet (placeholder + meta + UI glyphs) unless ?fonts=full.
  (function () {
    const F = window.DEV_FONTS;
    let text = null;
    if (!F.full) {
      const m = preset.meta || {};
      text = PLACEHOLDER + [m.title, m.titleLatin, m.artist, m.lyricist, m.composer].join('') +
        'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンー' +
        'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん' +
        '作詞曲編歌手唄演星僕国、。「」〜…・★☆♪' + ((MV.LyricFX && MV.LyricFX.fontSample) || '');
      for (let c = 32; c < 127; c++) text += String.fromCharCode(c);
    }
    window.DEV_FONTS.css = F.add(F.url(text));
  })();

  function syntheticFeatures() {
    const dur = preset.match.duration, fps = 100, n = Math.ceil(dur * fps);
    const mk = () => new Float32Array(n);
    const rms = mk(), low = mk(), mid = mk(), high = mk(), flux = mk();
    const beats = preset.beats;
    const secAt = (t) => preset.sections.find((s) => t >= s.start && t < s.end) || preset.sections[preset.sections.length - 1];
    for (let i = 0; i < n; i++) {
      const t = i / fps, I = secAt(t).intensity;
      const bi = Math.max(0, MV.lowerIndex(beats, t));
      const p = t >= beats[bi] ? MV.pulse(t - beats[bi], 0.25) : 0;
      const nz = MV.rand(77, i) * 0.08;
      rms[i] = MV.clamp(I * (0.65 + 0.3 * p) + nz);
      low[i] = MV.clamp(I * (0.4 + 0.6 * p) + nz);
      mid[i] = MV.clamp(I * 0.8 + nz);
      high[i] = MV.clamp(I * (0.5 + 0.4 * MV.rand(78, i)));
      flux[i] = MV.clamp(p * I + nz);
    }
    const phase = MV.mod(preset.downbeatPhase | 0, 4); // true downbeats = beats[phase::4]
    const onsets = [];
    beats.forEach((b, k) => {
      const I = secAt(b).intensity;
      onsets.push({ t: b, s: MV.clamp((MV.mod(k - phase, 4) === 0 ? 0.75 : 0.45) + 0.35 * I * MV.rand(91, k)) });
    });
    const f = {
      duration: dur, sampleRate: 22050, fps, length: n, rms, low, mid, high, flux, onsets, kicks: [],
      bpm: preset.bpm, beatsPerBar: 4, beats: beats.slice(), downbeats: beats.filter((_, k) => MV.mod(k - phase, 4) === 0), downbeatPhase: phase,
      sections: preset.sections.map((s) => Object.assign({}, s)), novelty: new Float32Array(0),
      source: 'computed', presetId: null, presetOffset: 0, presetConfidence: 0,
    };
    if (MV.Analysis) MV.Analysis.applyPreset(f, preset, 0, 1);
    return f;
  }

  // Fallback track builder when lyrics.js is missing (placeholder text,
  // phrases split on spaces, timed on the preset lines in order).
  function manualTrack(text) {
    const raw = text.split('\n').map((s) => MV.canonDisplay(s)).filter(Boolean);
    const pl = preset.lines.filter((l) => !l.skip);
    const lines = pl.map((p, idx) => {
      const txt = raw[idx % raw.length];
      const chars = Array.from(txt);
      const words = txt.split(' ');
      const phrases = [];
      let cs = 0;
      words.forEach((w, k) => {
        const n = Array.from(w).length;
        const pp = p.phrases[Math.min(k, p.phrases.length - 1)];
        const t = k < p.phrases.length ? pp.t : pp.t + 0.4 * (k - p.phrases.length + 1);
        phrases.push({ text: w, start: t, end: t, charStart: cs, charEnd: cs + n, latin: MV.text.isLatin(w) });
        cs += n + 1;
      });
      phrases.forEach((ph, k) => (ph.end = k + 1 < phrases.length ? phrases[k + 1].start : p.end));
      const charTimes = new Float32Array(chars.length);
      phrases.forEach((ph) => { for (let c = ph.charStart; c < ph.charEnd; c++) charTimes[c] = ph.start + 0.08 * (c - ph.charStart); });
      for (let i = 1; i < chars.length; i++) if (chars[i] === ' ') charTimes[i] = charTimes[i - 1];
      return {
        id: 'L' + p.n, n: p.n, index: idx, text: txt, chars, start: phrases[0].start, end: p.end,
        showStart: phrases[0].start - 0.3, showEnd: p.end + 1.2, phrases,
        segments: words.map((w) => ({ text: w })), charTimes, style: p.style, styleSource: 'preset',
        emphasis: 0.5, isHook: false, seed: MV.hash32(txt, p.n), sectionKind: 'verse',
      };
    });
    return { source: 'preset', meta: {}, lines, unmatched: [], warnings: [], matched: { total: lines.length, matched: lines.length, skipped: 0 } };
  }

  function parseTrack(text, features) {
    if (MV.Lyrics && MV.Lyrics.parse) {
      const tr = MV.Lyrics.parse(text, { preset, features });
      if (MV.Lyrics.assignStyles) MV.Lyrics.assignStyles(tr, features);
      return tr;
    }
    return manualTrack(text);
  }

  async function decodeSong(url) {
    const ab = await (await fetch(url)).arrayBuffer();
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ac.decodeAudioData(ab.slice(0));
    ac.close && ac.close();
    return { buf, ab };
  }

  /* ---------------------------------------------------------------- */
  /* Dev API                                                           */
  /* ---------------------------------------------------------------- */
  const canvas = document.getElementById('out');
  const DD = (window.DD = {
    MV, preset, stubs: STUBBED, features: null, track: null, director: null, stage: null, engine: null,
    /**
     * opts: { audio?: url, lyrics?: text, scale, debug, hud, adaptive, post }
     * Builds features (real analysis when audio is given, else synthetic),
     * the track, Director and Stage; awaits stage.prepare().
     */
    async init(opts = {}) {
      const t0 = performance.now();
      let features = null, analysisMs = 0;
      if (opts.audio && MV.Analysis) {
        const { buf } = await decodeSong(opts.audio);
        const a0 = performance.now();
        features = await MV.Analysis.compute(buf, {});
        const m = MV.Analysis.matchPreset(features, [preset]);
        if (m) MV.Analysis.applyPreset(features, m.preset, m.offset, m.confidence);
        analysisMs = performance.now() - a0;
        DD.audioBuffer = buf;
      } else features = syntheticFeatures();
      DD.features = features;
      DD.track = parseTrack(opts.lyrics || PLACEHOLDER, features);
      DD.director = new MV.Director({ features, track: DD.track, preset, options: { hud: opts.hud !== false, credits: true } });
      if (DD.stage) DD.stage.dispose();
      DD.stage = new MV.Stage({ canvas: opts.canvas || canvas, scale: opts.scale || 1, debug: !!opts.debug, adaptive: !!opts.adaptive, post: opts.post !== false });
      DD.stage.setDirector(DD.director);
      const p0 = performance.now();
      await window.DEV_FONTS.css;
      await DD.stage.prepare();
      const prepMs = performance.now() - p0;
      buildSectionSelect();
      return {
        ms: performance.now() - t0, prepMs, analysisMs, source: features.source,
        lines: DD.track.lines.length, trackSource: DD.track.source, summary: DD.director.summary(),
        post: DD.stage.stats.post, stubs: STUBBED.length,
      };
    },
    renderAt(t) {
      const r = DD.stage.renderFrame(t);
      return { ms: r.ms, evalMs: r.evalMs };
    },
    describe(t) {
      const st = DD.director.evaluate(t);
      return {
        t, section: st.env.section.name, kind: st.env.section.kind, intensity: +st.env.intensity.toFixed(3),
        scene: st.scene.from.name + (st.scene.to ? '→' + st.scene.to.name : ''),
        transition: st.scene.transition ? st.scene.transition.name + ' ' + st.scene.transition.p.toFixed(2) : '',
        lyrics: st.lyrics.map((l) => l.line.id + ':' + l.style), accents: st.accents.map((a) => a.kind),
        hud: st.hud.visible, camera: st.camera, post: st.post,
      };
    },
    errors() {
      return DD.stage ? Array.from(DD.stage.errors.entries()).map(([k, v]) => ({ key: k, count: v.count, message: v.message })) : [];
    },
    /** Draw frames at `times` into a labelled contact sheet; returns a PNG data URL. */
    sheet(times, cols = 3, cw = 640) {
      const ch = Math.round(cw * 9 / 16), lab = 34;
      const rows = Math.ceil(times.length / cols);
      const s = MV.makeCanvas(cols * cw + (cols + 1) * 8, rows * (ch + lab) + (rows + 1) * 8);
      const x = s.ctx;
      x.fillStyle = '#111';
      x.fillRect(0, 0, s.canvas.width, s.canvas.height);
      times.forEach((t, i) => {
        DD.stage.renderFrame(t);
        const d = DD.describe(t);
        const cx = 8 + (i % cols) * (cw + 8), cy = 8 + Math.floor(i / cols) * (ch + lab + 8);
        x.drawImage(DD.stage.canvas, cx, cy + lab, cw, ch);
        x.fillStyle = '#000';
        x.fillRect(cx, cy, cw, lab);
        x.fillStyle = '#E60012';
        x.fillRect(cx, cy, 6, lab);
        x.font = '600 15px ui-monospace, Menlo, Consolas, monospace';
        x.fillStyle = '#fff';
        x.fillText(`${t.toFixed(2)}s ${d.section} I${d.intensity.toFixed(2)} ${d.scene}${d.transition ? ' [' + d.transition + ']' : ''}`, cx + 12, cy + 15);
        x.fillStyle = '#FFE14D';
        x.fillText(`${d.lyrics.join(' ') || '—'} | ${d.accents.join(' ') || '—'}`, cx + 12, cy + 30);
      });
      return s.canvas.toDataURL('image/png');
    },
    frameURL() {
      return DD.stage.canvas.toDataURL('image/png');
    },
    async play(from) {
      const t0 = from || +tSlider.value;
      if (DD.engine) {
        DD.engine.play(t0);
      } else {
        playing = { at: performance.now(), t0 };
      }
      loop();
    },
    pause() {
      if (DD.engine) DD.engine.pause();
      playing = null;
    },
  });

  /* ---------------------------------------------------------------- */
  /* UI                                                                */
  /* ---------------------------------------------------------------- */
  const tSlider = document.getElementById('t');
  const tv = document.getElementById('tv');
  const info = document.getElementById('info');
  const secSel = document.getElementById('sec');
  let playing = null, raf = 0;
  function currentT() {
    if (DD.engine && DD.engine.playing) return DD.engine.currentTime;
    if (playing) return playing.t0 + (performance.now() - playing.at) / 1000;
    return +tSlider.value;
  }
  function draw(t) {
    if (!DD.stage) return;
    DD.stage.renderFrame(t);
    tv.textContent = MV.fmtTime(t);
    const S = DD.stage.stats;
    info.textContent = `${S.fps.toFixed(0)} fps · frame ${S.avgMs.toFixed(1)} ms · eval ${S.avgEvalMs.toFixed(3)} ms · ${S.post} · ×${DD.stage.scale}`;
  }
  function loop() {
    cancelAnimationFrame(raf);
    const step = () => {
      const t = currentT();
      if ((DD.engine && DD.engine.playing) || playing) {
        tSlider.value = t;
        draw(t);
        raf = requestAnimationFrame(step);
      }
    };
    raf = requestAnimationFrame(step);
  }
  function buildSectionSelect() {
    secSel.innerHTML = '';
    DD.director.sections.forEach((s) => {
      const o = document.createElement('option');
      o.value = s.start;
      o.textContent = `${s.name} ${MV.fmtTime(s.start)}`;
      secSel.appendChild(o);
    });
  }
  tSlider.addEventListener('input', () => {
    if (DD.engine && DD.engine.playing) DD.engine.seek(+tSlider.value);
    else if (playing) playing = { at: performance.now(), t0: +tSlider.value };
    draw(+tSlider.value);
  });
  secSel.addEventListener('change', () => {
    tSlider.value = +secSel.value + 0.01;
    if (DD.engine && DD.engine.playing) DD.engine.seek(+tSlider.value);
    draw(+tSlider.value);
  });
  document.getElementById('play').addEventListener('click', () => {
    const on = (DD.engine && DD.engine.playing) || playing;
    if (on) DD.pause();
    else DD.play();
  });
  document.getElementById('dbg').addEventListener('change', (e) => { DD.stage.setDebug(e.target.checked); draw(currentT()); });
  document.getElementById('hud').addEventListener('change', (e) => { DD.director.setOptions({ hud: e.target.checked }); draw(currentT()); });
  document.getElementById('adp').addEventListener('change', (e) => DD.stage.setAdaptive(e.target.checked));
  document.getElementById('scale').addEventListener('change', (e) => { DD.stage.resize(+e.target.value); draw(currentT()); });
  document.getElementById('lyrApply').addEventListener('click', () => {
    const text = document.getElementById('lyr').value;
    DD.track = parseTrack(text.trim() ? text : PLACEHOLDER, DD.features);
    DD.director.setTrack(DD.track);
    MV.fonts.ensure(DD.director.fontText()).then(() => { DD.stage.invalidateLayouts(); draw(currentT()); });
  });
  document.getElementById('song').addEventListener('click', async () => {
    info.textContent = '分析中 analysing…';
    const r = await DD.init({ audio: '../assets/song.mp3', debug: document.getElementById('dbg').checked, lyrics: document.getElementById('lyr').value.trim() || undefined });
    if (MV.AudioEngine && DD.audioBuffer) {
      DD.engine = new MV.AudioEngine();
      await DD.engine.loadURL('../assets/song.mp3');
    }
    info.textContent = `ok · ${r.source} · analysis ${r.analysisMs.toFixed(0)} ms`;
    draw(+tSlider.value);
  });

  if (!q.has('manual')) {
    DD.ready = DD.init({ debug: !q.has('nodebug'), scale: +(q.get('scale') || 1) }).then((r) => {
      tSlider.value = +(q.get('t') || 0);
      draw(+tSlider.value);
      return r;
    });
  }
})();
</script>
</body>
</html>
