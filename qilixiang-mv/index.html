<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七里香 · 手绘 MV</title>
<style>
  :root { --bg: #1b1916; --fg: #efe6d6; --accent: #e8b64c; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "LXGW WenKai", serif; }
  body { min-height: 100vh; display: grid; place-items: center; }
  .stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
  .ui { position: absolute; left: 16px; right: 16px; bottom: 12px; display: flex; gap: 12px; align-items: center; }
  .ui button { font: inherit; background: rgba(0,0,0,.55); color: var(--fg); border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  .ui input { flex: 1; accent-color: var(--accent); }
  .ui span { font-variant-numeric: tabular-nums; min-width: 5ch; text-shadow: 0 1px 2px #000; }
  body.render .ui { display: none; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div class="ui">
    <button id="play">播放</button>
    <input id="seek" type="range" min="0" max="297" step="0.01" value="0">
    <span id="time">0:00</span>
  </div>
</div>
<audio id="audio" src="input/song.mp3" preload="auto"></audio>
<script src="src/kit.js"></script>
<script src="src/paint.js"></script>
<script src="src/people.js"></script>
<script src="src/lyrics.js"></script>
<script src="src/scenes.js"></script>
<script src="src/main.js"></script>
</body>
</html>
